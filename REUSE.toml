version = 1
SPDX-PackageName = "Tonga"
SPDX-PackageSupplier = "Área de Tecnología Educativa, Gobierno de Canarias"
SPDX-PackageDownloadLocation = "https://github.com/ateeducacion/tonga"

# Software, configuration and documentation of the maintained app: GNU AGPL v3 or later
# (decision recorded in docs/LICENSING.md, 2026-10-02).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-2026 Gobierno de Canarias"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Image collections. Evidence: the original credits (upstream branch, creditos.html) state that
# the content belongs to the Gobierno de Canarias under CC BY-NC-SA 4.0. No per-image
# attribution exists in the repository.
[[annotations]]
path = ["repositorios/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Gobierno de Canarias"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Files exported by the legacy app and screenshots: they contain library images.
[[annotations]]
path = ["test/fixtures/legacy/**", "docs/screenshots/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Gobierno de Canarias"
SPDX-License-Identifier = "AGPL-3.0-or-later AND CC-BY-NC-SA-4.0"

# Lucide icon paths (ISC; some derived from Feather, MIT) and the Octicons GitHub mark (MIT)
# inside Tonga's own module.
[[annotations]]
path = ["src/ui/icons.ts"]
precedence = "override"
SPDX-FileCopyrightText = ["2019-2026 Gobierno de Canarias", "2026 Lucide Icons and Contributors", "2013-present Cole Bemis", "2026 GitHub Inc."]
SPDX-License-Identifier = "AGPL-3.0-or-later AND ISC AND MIT"

# Files copied verbatim from eXeLearning (commit 68d6cd53d) for the .elpx export (THIRD_PARTY_NOTICES.md).
[[annotations]]
path = ["vendor/exelearning/content.dtd"]
precedence = "override"
SPDX-FileCopyrightText = "eXeLearning contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The "base" style: Ignacio Gros for eXeLearning; iDevice icons by Francisco Javier Pulido Cuadrado.
# img/licenses.gif holds Creative Commons badges (trademarks used under the CC policy).
[[annotations]]
path = ["vendor/exelearning/theme/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Ignacio Gros for eXeLearning", "Francisco Javier Pulido Cuadrado"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Third-party agent skills, installed verbatim with `gh skill add` (.agents/upstream-skills.txt).
[[annotations]]
path = [".agents/skills/github-actions-hardening/**", ".agents/skills/test-gap-audit/**", ".claude/skills/github-actions-hardening/**", ".claude/skills/test-gap-audit/**"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/security-audit/**", ".claude/skills/security-audit/**"]
precedence = "override"
SPDX-FileCopyrightText = "Cloudflare, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/playwright-cli/**", ".agents/skills/playwright-trace/**", ".claude/skills/playwright-cli/**", ".claude/skills/playwright-trace/**"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".agents/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = ["GitHub, Inc.", "Cloudflare, Inc.", "Microsoft Corporation"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Link-preview screenshot: it shows library images.
[[annotations]]
path = ["public/og-image.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Gobierno de Canarias"
SPDX-License-Identifier = "AGPL-3.0-or-later AND CC-BY-NC-SA-4.0"

# Logo of the Área de Tecnología Educativa, shown in the Info dialog and the link-preview card
# (taken from ateeducacion/elpx-optimizer, src/web/assets/ate-logo.png).
[[annotations]]
path = ["public/ate-logo.png"]
precedence = "override"
SPDX-FileCopyrightText = "Gobierno de Canarias (Área de Tecnología Educativa)"
SPDX-License-Identifier = "AGPL-3.0-or-later"
