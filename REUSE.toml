version = 1
SPDX-PackageName = "Tonga"
SPDX-PackageSupplier = "Área de Tecnología Educativa, Gobierno de Canarias"
SPDX-PackageDownloadLocation = "https://github.com/ateeducacion/tonga"

# Software, configuration and documentation of the maintained app.
# LicenseRef-Tonga-AGPL-3.0 = GNU AGPL v3 with the "only"/"or later" choice still undocumented
# by the rights holder (docs/LICENSING.md). Replace it once that decision is recorded.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-2026 Gobierno de Canarias"
SPDX-License-Identifier = "LicenseRef-Tonga-AGPL-3.0"

# Image collections. Evidence: the original credits (upstream branch, creditos.html) state that
# the content belongs to the Gobierno de Canarias under CC BY-NC-SA 4.0. No per-image
# attribution exists in the repository.
[[annotations]]
path = ["repositorios/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Gobierno de Canarias"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Files exported by the legacy app and screenshots: they contain library images.
[[annotations]]
path = ["test/fixtures/legacy/**", "docs/screenshots/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Gobierno de Canarias"
SPDX-License-Identifier = "LicenseRef-Tonga-AGPL-3.0 AND CC-BY-NC-SA-4.0"

# Lucide icon paths (ISC; some derived from Feather, MIT) inside Tonga's own module.
[[annotations]]
path = ["src/ui/icons.ts"]
precedence = "override"
SPDX-FileCopyrightText = ["2019-2026 Gobierno de Canarias", "2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "LicenseRef-Tonga-AGPL-3.0 AND ISC AND MIT"

# Third-party agent skills, installed verbatim with `gh skill add` (.agents/upstream-skills.txt).
[[annotations]]
path = [".agents/skills/github-actions-hardening/**", ".agents/skills/test-gap-audit/**", ".claude/skills/github-actions-hardening/**", ".claude/skills/test-gap-audit/**"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/security-audit/**", ".claude/skills/security-audit/**"]
precedence = "override"
SPDX-FileCopyrightText = "Cloudflare, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/playwright-cli/**", ".agents/skills/playwright-trace/**", ".claude/skills/playwright-cli/**", ".claude/skills/playwright-trace/**"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".agents/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = ["GitHub, Inc.", "Cloudflare, Inc.", "Microsoft Corporation"]
SPDX-License-Identifier = "MIT OR Apache-2.0"
