# Publishes dist/ to GitHub Pages, only after CI succeeded on main.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment in progress is never cut; a newer one waits and replaces any older pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs may only redeploy main; automatic runs only after a successful CI on a push to main.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # origin/main, for the check below
          persist-credentials: false

      - name: Deploy only commits that are on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: https://ateeducacion.github.io/tonga/
          SOURCEMAP: hidden

      # Loads a standalone Sentry bundle before the app on every page, precaches it in sw.js,
      # uploads the source maps (when the org secret exists) and deletes them before publishing.
      - name: Add Sentry error monitoring
        env:
          SENTRY_DSN: https://c03dc1ccd233b985292956d0d8d0fc57@o4510456164712448.ingest.de.sentry.io/4512272277700688
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: erseco
          SENTRY_PROJECT: tonga
          SENTRY_URL: https://de.sentry.io/
          DIST: dist
        run: |
          REL="${GITHUB_SHA::12}"
          work="$RUNNER_TEMP/sentry"; mkdir -p "$work"
          printf '%s\n' \
            "import * as Sentry from '@sentry/browser';" \
            "Sentry.init({ dsn: '$SENTRY_DSN', release: '$REL', environment: 'production', sendDefaultPii: false });" \
            > "$work/entry.js"
          (cd "$work" && npm i --no-save --no-audit --no-fund --silent --ignore-scripts @sentry/browser@11.4.0 esbuild@0.28.2 \
            && npx esbuild entry.js --bundle --minify --format=iife --outfile="$GITHUB_WORKSPACE/$DIST/sentry.js")
          # load before the app's own scripts, from every built page
          find "$DIST" -name '*.html' -print0 | while IFS= read -r -d '' f; do
            rel=$(realpath --relative-to="$(dirname "$f")" "$DIST/sentry.js")
            sed -i "0,/<head[^>]*>/s##&<script src=\"$rel\"></script>#" "$f"
          done
          # offline: the service worker precaches the app shell, sentry.js included
          sed -i 's#\["\./",#["./","./sentry.js",#' "$DIST/sw.js"
          grep -q '"./sentry.js"' "$DIST/sw.js"
          if [ -n "$SENTRY_AUTH_TOKEN" ] && find "$DIST" -name '*.map' | grep -q .; then
            npx --yes @sentry/cli@3.8.0 sourcemaps inject "$DIST"
            npx --yes @sentry/cli@3.8.0 sourcemaps upload --release "$REL" "$DIST"
          fi
          find "$DIST" -name '*.map' -delete   # never publish sourcemaps

      - run: npm run check

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
