# Tonga: static files with the headers recommended in docs/SECURITY.md.
# Vite hashes assets/; everything else (index.html, sw.js, catalog.json) is revalidated so
# updates reach the service worker.
map $uri $tonga_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control $tonga_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
